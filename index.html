<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>岛上的瞬间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #888;
      --accent: #4a9eff;
      --gold: #d4a056;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--fg);
    }
    
    .font-display { font-family: 'Cormorant Garamond', serif; }
    
    /* ===== 全屏图片容器 ===== */
    .photo-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    
    .scene-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      /* Ken Burns 缓慢推近效果 */
      animation: slowZoom 20s ease-in-out infinite alternate;
    }
    
    @keyframes slowZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    
    /* 渐变遮罩：让文字可读 */
    .scene-overlay {
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(to bottom, 
          rgba(10,10,10,0.2) 0%, 
          rgba(10,10,10,0) 40%, 
          rgba(10,10,10,0.4) 70%, 
          rgba(10,10,10,0.95) 100%);
      z-index: 1;
    }
    
    /* ===== 文字内容层 ===== */
    .content-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 50px 20px 30px;
      pointer-events: none;
    }
    
    .top-area {
      flex: 0 0 auto;
      text-align: center;
      animation: fadeIn 1s ease 0.3s both;
    }
    
    .scene-tag {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 100px;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      backdrop-filter: blur(4px);
    }
    
    .spacer { flex: 1; }
    
    .bottom-area {
      flex: 0 0 auto;
      pointer-events: auto;
      animation: slideUp 0.8s ease 0.5s both;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* ===== 对话卡片 ===== */
    .dialogue-card {
      max-width: 380px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    
    .quote-mark {
      font-size: 3rem;
      line-height: 0.5;
      color: var(--accent);
      opacity: 0.6;
      margin-bottom: 8px;
    }
    
    .english-quote {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 12px;
      color: var(--fg);
    }
    
    .chinese-quote {
      font-size: 1rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 20px;
    }
    
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      margin: 16px 0;
    }
    
    .narrative {
      font-size: 0.85rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.7);
    }
    
    .highlight {
      color: var(--gold);
      font-weight: 600;
    }
    
    /* ===== 人物标签 ===== */
    .character-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    
    .char-info {
      font-size: 0.75rem;
      color: var(--muted);
    }
    
    /* ===== 底部装饰 ===== */
    .bottom-hint {
      text-align: center;
      margin-top: 24px;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    
    /* ===== 图片说明 ===== */
    .photo-credit {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.3);
      z-index: 15;
    }
    
    @media (min-width: 768px) {
      .dialogue-card {
        max-width: 450px;
        padding: 36px 32px;
      }
      .english-quote {
        font-size: 2rem;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .scene-img { animation: none; }
      * { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  
  <!-- 真实照片背景 -->
  <div class="photo-scene">
    <!-- 
      图片说明：这是一个真实照片，展示的是人站在海边岩石上看海的背影
      如果你有自己的照片，请把下面的 URL 换成你的图片地址
    -->
    <img 
      class="scene-img" 
      src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1200&q=80" 
      alt="人站在海边的岩石上，俯瞰大海"
    >
  </div>
  
  <!-- 遮罩 -->
  <div class="scene-overlay"></div>
  
  <!-- 内容 -->
  <div class="content-layer">
    
    <div class="top-area">
      <span class="scene-tag">Island Moment</span>
    </div>
    
    <div class="spacer"></div>
    
    <div class="bottom-area">
      <div class="dialogue-card">
        <div class="quote-mark font-display">"</div>
        <p class="english-quote font-display">Can you take a picture?</p>
        <p class="chinese-quote">你能帮我拍张照片吗？</p>
        
        <div class="divider"></div>
        
        <p class="narrative">
          站在<span class="highlight">岛屿的巨石</span>上，面前是无尽的蔚蓝。
          一个陌生的声音从身后传来。
          回过头，一位外国游客举着手机。
          <span class="highlight">语言不通</span>，但笑意是通用的。
        </p>
        
        <div class="character-tag">
          <div class="avatar">J</div>
          <span class="char-info">A traveler from abroad</span>
        </div>
      </div>
      
      <p class="bottom-hint">Touch the screen to pause</p>
    </div>
    
  </div>
  
  <span class="photo-credit">Photo: Unsplash</span>

</body>
</html>
